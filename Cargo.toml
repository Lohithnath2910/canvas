[workspace]
resolver = "2"
members = [
    "crates/canvas-app",
    "crates/canvas-ui",
    "crates/canvas-doc",
    "crates/canvas-storage",
    "crates/canvas-sync",
]

[workspace.dependencies]

slint = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
] }
slint-build = "1.17.1"

yrs = "0.19.2"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
mimalloc = { version = "0.1", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
raw-window-handle = "0.6.2"

canvas-ui = { path = "crates/canvas-ui" }
canvas-doc = { path = "crates/canvas-doc" }
canvas-storage = { path = "crates/canvas-storage" }
canvas-sync = { path = "crates/canvas-sync" }

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
